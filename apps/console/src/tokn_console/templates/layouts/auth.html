{% extends "layouts/base.html" %}

{% block nav %}
<header class="nav">
  <div class="shell nav__inner">
    <a class="nav__brand" href="/" aria-label="{{ product }} home">
      <span class="nav__mark" aria-hidden="true">{{ site_mark }}</span>
      <span class="nav__wordmark">{{ product }}</span>
    </a>
    <div class="nav__right">
      <a class="nav__link" href="/">Back to site</a>
    </div>
  </div>
</header>
{% endblock %}

{% block content %}
<div class="shell auth-page">
  <div class="auth-card">
    <div class="auth-card__mark" aria-hidden="true">{{ site_mark }}</div>
    {% block card %}{% endblock %}
  </div>
  <p class="auth-card__aside">
    {% block aside %}
      Need help? <a href="mailto:{{ support_email }}">Write to us</a>.
    {% endblock %}
  </p>
</div>
{% endblock %}
