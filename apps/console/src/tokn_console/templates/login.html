{% extends "layouts/auth.html" %}
{% block title %}Sign in, {{ product }}{% endblock %}
{% block card %}
  <h1>Sign in</h1>

  {% if error %}<p class="banner banner--error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/login" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

    <label for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="username" required>

    <label for="password">Password</label>
    <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>

    <label for="code">Authenticator code{% if not needs_code %} (if enabled){% endif %}</label>
    <input class="input" id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code">

    <button type="submit" class="button button--primary">Sign in</button>
  </form>

  <p class="muted"><a href="/reset">Forgot your password?</a> · <a href="/signup">Create an account</a></p>
{% endblock %}
