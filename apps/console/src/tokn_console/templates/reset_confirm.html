{% extends "layouts/auth.html" %}
{% block title %}Choose a new password, {{ product }}{% endblock %}
{% block card %}
  <h1>Choose a new password</h1>

  {% if error %}<p class="banner banner--error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/reset/confirm" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">

    <label for="password">New password</label>
    <input class="input" id="password" name="password" type="password" autocomplete="new-password"
           minlength="12" required>
    <p class="hint">At least 12 characters.</p>

    <button type="submit" class="button button--primary">Change password</button>
  </form>
{% endblock %}
