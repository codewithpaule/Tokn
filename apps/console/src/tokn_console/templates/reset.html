{% extends "layouts/auth.html" %}
{% block title %}Reset your password, {{ product }}{% endblock %}
{% block card %}
  <h1>Reset your password</h1>
  <p class="muted">We will email a link that works once, for 30 minutes.</p>

  <form method="post" action="/reset" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Email</label>
    <input class="input" id="email" name="email" type="email" autocomplete="username" required>
    <button type="submit" class="button button--primary">Send link</button>
  </form>
{% endblock %}
