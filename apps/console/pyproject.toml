[project]
name = "tokn-console"
version = "0.1.0"
description = "Tokn control plane: accounts, keys, billing, admin."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tokn-core",
    "tokn-infra",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokn_console"]
