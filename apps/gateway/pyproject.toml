[project]
name = "tokn-gateway"
version = "0.1.0"
description = "Tokn data plane: authenticated, metered, streaming inference."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tokn-core",
    "tokn-infra",
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokn_gateway"]
