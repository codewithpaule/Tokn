[project]
name = "tokn-infra"
version = "0.1.0"
description = "Tokn adapters: Postgres, Redis, providers, payments, email."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "tokn-core",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tokn_infra"]
